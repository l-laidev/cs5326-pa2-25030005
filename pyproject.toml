[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "small-model-alignment-starter"
version = "0.1.0"
description = "Starter files for a small-model SFT and DPO alignment assignment."
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.18,<5",
    "huggingface-hub>=0.36.2",
    "kaggle-benchmarks>=0.6.1",
    "matplotlib>=3.10.9",
    "peft>=0.11.0",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "tqdm>=4.70.1",
    "transformers>=4.43.0,<5",
    "trl>=1.14.2",
]

[tool.setuptools]
packages = []
